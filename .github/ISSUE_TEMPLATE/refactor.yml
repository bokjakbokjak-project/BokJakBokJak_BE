name: Refactor Template
description: 동작은 유지하고 구조·가독성을 개선할 때 쓰는 템플릿
title: "[Refactor] "
labels: ["♻️ refactor"]

body:
  - type: input
    id: refactor-content
    attributes:
      label: "♻️ 어떤 부분을 정리하나요?"
      description: 정리할 대상을 한 줄로 적어주세요.
      placeholder: ex. 매칭 상태 변경 로직을 엔티티 메서드로 분리
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: "👀 자세한 내용 (Optional)"
      description: 왜 정리하는지, 어떻게 바꾸는지 적어주세요.
      placeholder: ex. 서비스 여러 곳에서 상태를 직접 바꾸고 있어 실수 가능성이 큼
    validations:
      required: false
