name: Deploy

# main에 push되면 서버에 자동 배포한다.
# 필요한 Secret: VM_HOST, VM_USER, VM_SSH_KEY, ENV_FILE, (선택) DISCORD_DEPLOY_WEBHOOK_URL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: bokjak-be
  CONTAINER_NAME: bokjak-be
  APP_DIR: bokjak

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JAR 빌드 (테스트는 CI에서 실행)
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: 이미지 이름과 태그 생성
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/${REPO_LC}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: 서버에 배포
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ENV_FILE,IMAGE,TAG,GHCR_USER,GHCR_TOKEN,CONTAINER_NAME,APP_DIR
          script: |
            set -euo pipefail

            # GitHub Secret의 .env 내용으로 서버 .env를 덮어쓴다
            mkdir -p "$HOME/$APP_DIR"
            printf '%s\n' "$ENV_FILE" > "$HOME/$APP_DIR/.env"
            chmod 600 "$HOME/$APP_DIR/.env"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:$TAG"

            docker rm -f "$CONTAINER_NAME" || true

            # PostgreSQL·Redis 컨테이너와 같은 네트워크(bokjak)에 붙인다. 서버 첫 설정은 docs/DEPLOY.md
            docker network create bokjak 2>/dev/null || true

            # 8080은 서버 내부에만 열고, 외부 요청은 Nginx가 받아서 넘긴다
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --network bokjak \
              -p 127.0.0.1:8080:8080 \
              --env-file "$HOME/$APP_DIR/.env" \
              "$IMAGE:$TAG"

            # 최대 90초 동안 /api/health가 응답하는지 확인한다
            # (환경변수 누락, DB 연결 실패 등으로 앱이 못 뜨는 경우를 잡는다)
            for i in $(seq 1 18); do
              if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
                echo "헬스 체크 통과 (${i}번째 시도)"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "앱이 응답하지 않습니다. 마지막 로그:"
                docker logs --tail 100 "$CONTAINER_NAME" || true
                exit 1
              fi
              sleep 5
            done

            docker image prune -f || true

      - name: 디스코드 알림
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "디스코드 웹훅 미설정, 건너뜀"
            exit 0
          fi

          TITLE="🚀 배포 성공"
          COLOR=5763719
          if [ "$JOB_STATUS" != "success" ]; then
            TITLE="❌ 배포 실패"
            COLOR=15548997
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"color\":$COLOR,\"fields\":[
                {\"name\":\"Commit\",\"value\":\"${GITHUB_SHA::7}\",\"inline\":true},
                {\"name\":\"Actor\",\"value\":\"${GITHUB_ACTOR}\",\"inline\":true},
                {\"name\":\"Actions\",\"value\":\"${RUN_URL}\",\"inline\":false}]}]}" \
            "$DISCORD_WEBHOOK_URL" || true
