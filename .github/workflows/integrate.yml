name: CI

# dev 또는 main으로 PR을 올리면 실행된다.
# 1) PR 코드 자체로 테스트  2) 대상 브랜치와 머지했다고 가정하고 충돌·빌드 확인
# 테스트는 application-test.yml의 H2 메모리 DB를 쓰므로 PostgreSQL·Redis가 필요 없다.

on:
  pull_request:
    branches: ["dev", "main"]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr_build:
    name: PR 머지 결과 검증
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TZ: Asia/Seoul
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: PR 코드 단독 테스트
        run: |
          echo "::notice::PR 코드 단독 테스트를 실행합니다."
          ./gradlew test --no-daemon --console=plain --quiet || {
            echo "::error::❌ PR 코드 자체에서 테스트가 실패했습니다. 상세 로그로 다시 실행합니다."
            ./gradlew test --no-daemon --console=plain --info --stacktrace
            exit 1
          }

      - name: Git 사용자 정보 설정 (머지 시뮬레이션용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 대상 브랜치 기준 머지 시뮬레이션
        run: |
          echo "::notice::${BASE_BRANCH} 브랜치에 합쳐졌다고 가정하고 확인합니다."
          git fetch origin "$BASE_BRANCH"
          git checkout --detach "origin/$BASE_BRANCH"
          git merge --no-commit --no-ff "$HEAD_SHA" || {
            echo "::error::❌ ${BASE_BRANCH} 브랜치와 충돌이 발생했습니다. ${BASE_BRANCH}를 받아서 충돌을 해결해주세요."
            git status
            exit 1
          }

      - name: 머지 결과 빌드 및 테스트
        run: |
          echo "::notice::머지된 결과로 빌드와 테스트를 실행합니다."
          ./gradlew build --no-daemon --console=plain --quiet || {
            echo "::error::❌ PR은 통과했지만 ${BASE_BRANCH}와 합쳐진 결과에서 실패했습니다. 상세 로그로 다시 실행합니다."
            ./gradlew build --no-daemon --console=plain --info --stacktrace
            exit 1
          }
