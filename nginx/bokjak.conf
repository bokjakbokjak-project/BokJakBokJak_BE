# 서버의 /etc/nginx/conf.d/bokjak.conf 에 넣는다.
# api.example.com 을 실제 도메인으로 바꾼 뒤 아래 명령으로 HTTPS 인증서를 발급한다.
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com
# certbot이 443 설정과 HTTP→HTTPS 이동을 자동으로 추가한다.

# 나중에 채팅을 WebSocket으로 바꿀 때 필요한 설정. 폴링 단계에서도 미리 넣어두면 그대로 동작한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 호출이 있는 요청과 WebSocket 연결이 끊기지 않게 넉넉히
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
