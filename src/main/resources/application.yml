spring:
  application:
    name: bokjakbokjak-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bokjakbokjak}
    username: ${DB_USERNAME:bokjakbokjak}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway(src/main/resources/db/migration)가 먼저 돌고, 마이그레이션에 없는 테이블만 JPA가 만든다.
      # 같은 테이블을 양쪽에서 만들지 않는다.
      ddl-auto: update
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:bokjakbokjak}
    audience: ${JWT_AUDIENCE:bokjakbokjak-api}
    ttl: ${JWT_ACCESS_TTL:30m}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
    # 비어 있으면 테스트 로그인 API(/api/auth/dev-login)가 꺼진다
    dev-login-key: ${DEV_LOGIN_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  matching:
    # ROOM_TYPE: 같은 기숙사·같은 방 타입만 후보 / DORMITORY: 같은 기숙사면 방 타입이 달라도 후보
    candidate-scope: ${MATCHING_CANDIDATE_SCOPE:ROOM_TYPE}
